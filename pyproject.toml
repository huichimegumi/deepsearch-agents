[project]
name = "deepsearch-agents"
version = "0.1.0"
description = "A multi-agent deep research system with hybrid retrieval and real-time execution tracking."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "celery[redis]>=5.4.0",
    "deepagents==0.5.7",
    "ddgs>=9.6.1",
    "fastapi>=0.100.0",
    "fastembed>=0.6.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "langgraph-checkpoint-postgres>=3.0.0",
    "markdown>=3.5",
    "minio>=7.2.0",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "qdrant-client>=1.14.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
