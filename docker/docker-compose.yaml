# DeepSearch Agents local development stack
#
# 运行位置：在 docker 目录执行 docker compose up -d。
# 首次启动时，mysql/mysql.sql 会被官方镜像自动导入到 deepsearch_db。
# 如果数据卷已存在，MySQL 不会重复执行初始化脚本，需要重建 volume 才会重新导入。

name: deepsearch-agents

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deepsearch-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://deepsearch:deepsearch@postgres:5432/deepsearch_rag
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_MINIO_ENDPOINT: minio:9000
      FASTEMBED_CACHE_PATH: /models
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../app/output:/workspace/app/output
      - ../app/updated:/workspace/app/updated
      - deepsearch_model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rag-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deepsearch-rag-worker
    restart: unless-stopped
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.rag.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
    env_file:
      - ../.env
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://deepsearch:deepsearch@postgres:5432/deepsearch_rag
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_MINIO_ENDPOINT: minio:9000
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - deepsearch_model_cache:/models
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: deepsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsearch}
      POSTGRES_DB: ${POSTGRES_DB:-deepsearch_rag}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deepsearch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: deepsearch-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - deepsearch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: deepsearch-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - deepsearch_qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: deepsearch-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepsearch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deepsearch-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - deepsearch_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: deepsearch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepsearch_db}
      TZ: Asia/Shanghai
    # 与 Python 连接配置保持一致，避免中文字段或日期时间在导入、查询时出现偏差
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=TRADITIONAL
    ports:
      # .env.example 默认使用 3307，避免和本机已有 MySQL 的 3306 端口冲突
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - deepsearch_mysql_data:/var/lib/mysql
      # 只读挂载初始化 SQL，容器首次创建数据目录时会自动执行
      - ./mysql/mysql.sql:/docker-entrypoint-initdb.d/01-init-pharma.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  deepsearch_mysql_data:
  deepsearch_postgres_data:
  deepsearch_redis_data:
  deepsearch_qdrant_data:
  deepsearch_minio_data:
  deepsearch_model_cache:
