name: Evaluation v4 CPU checks

on:
  push:
    branches: [main]
    paths:
      - 'app/research/**'
      - 'app/agent/llm.py'
      - 'evals/**'
      - 'scripts/evaluate.py'
      - 'tests/**'
      - '.github/workflows/evaluation-v4.yml'
      - 'uv.lock'
  pull_request:
  workflow_dispatch:
    inputs:
      live_api_smoke:
        description: 'Run the small real DeepSeek API smoke (requires repository secret)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      FASTEMBED_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --group dev
      - name: Offline process, budget, source, scoring and cancellation checks
        run: uv run python -m scripts.evaluate check --junit offline-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-v4-${{ matrix.os }}
          path: offline-results.xml

  live-api:
    if: github.event_name == 'workflow_dispatch' && inputs.live_api_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --group dev
      - run: uv run python -m evals.api_smoke_v4 --output evals/results/ci-api-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-v4-api-smoke
          path: evals/results/ci-api-smoke/summary.json
